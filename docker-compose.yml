name: novagen

x-service-common: &service-common
  env_file: .env
  restart: unless-stopped
  networks: [novagen-net]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  # ===================== Data layer =====================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [novagen-net]

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes: [mongodata:/data/db]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [novagen-net]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    volumes: [neo4jdata:/data]
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [novagen-net]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [novagen-net]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [novagen-net]

  # ===================== API Gateway =====================
  gateway:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    ports: ["8000:8000"]
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      DRUG_SERVICE_URL: http://drug-service:8002
      PREDICTION_SERVICE_URL: http://prediction-service:8003
      ANALYTICS_SERVICE_URL: http://analytics-service:8004
      EXPERIMENT_SERVICE_URL: http://experiment-service:8005
      REPORT_SERVICE_URL: http://report-service:8006
      NOTIFICATION_SERVICE_URL: http://notification-service:8007
      WORKFLOW_SERVICE_URL: http://workflow-service:8008
      # NOTE: automation-service is intentionally NOT routable from the gateway.

  # ===================== Core services =====================
  auth-service:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    ports: ["8001:8001"]

  drug-service:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: drug-service/Dockerfile
    ports: ["8002:8002"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  prediction-service:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: prediction-service/Dockerfile
    ports: ["8003:8003"]
    volumes:
      - model-cache:/app/models

  analytics-service:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: analytics-service/Dockerfile
    ports: ["8004:8004"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }

  experiment-service:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: experiment-service/Dockerfile
    ports: ["8005:8005"]

  report-service:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: report-service/Dockerfile
    ports: ["8006:8006"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }

  notification-service:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    ports: ["8007:8007"]

  workflow-service:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: workflow-service/Dockerfile
    ports: ["8008:8008"]

  # Internal-only orchestration. No published ports beyond the internal network,
  # and deliberately absent from the gateway's routable service map above.
  automation-service:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: automation-service/Dockerfile
    expose: ["8009"]

  # ===================== Background workers =====================
  celery-worker:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: automation-service/Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  celery-beat:
    <<: *service-common
    build:
      context: ./backend
      dockerfile: automation-service/Dockerfile
    command: celery -A app.worker.celery_app beat --loglevel=info
    depends_on:
      redis: { condition: service_healthy }

  # ===================== Frontend (added Stage 2) =====================
  # frontend:
  #   build: ./frontend
  #   ports: ["3000:3000"]
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8000
  #   depends_on: [gateway]
  #   networks: [novagen-net]

networks:
  novagen-net:
    driver: bridge

volumes:
  pgdata:
  mongodata:
  neo4jdata:
  miniodata:
  model-cache:
