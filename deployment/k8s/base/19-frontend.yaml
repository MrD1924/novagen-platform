apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: novagen
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/novagen/novagen-frontend:latest
          ports: [{ containerPort: 3000 }]
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom: { configMapKeyRef: { name: novagen-config, key: NEXT_PUBLIC_API_URL } }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: novagen
spec:
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000 }]
