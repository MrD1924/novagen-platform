apiVersion: apps/v1
kind: Deployment
metadata:
  name: experiment-service
  namespace: novagen
  labels: { app: experiment-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: experiment-service }
  template:
    metadata:
      labels: { app: experiment-service }
    spec:
      containers:
        - name: experiment-service
          image: ghcr.io/novagen/novagen-experiment-service:latest
          ports: [{ containerPort: 8005 }]
          envFrom:
            - configMapRef: { name: novagen-config }
            - secretRef: { name: novagen-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: experiment-service
  namespace: novagen
spec:
  selector: { app: experiment-service }
  ports: [{ port: 8005, targetPort: 8005 }]
