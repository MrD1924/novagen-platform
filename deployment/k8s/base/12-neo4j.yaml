apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: novagen
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels: { app: neo4j }
  template:
    metadata:
      labels: { app: neo4j }
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - { containerPort: 7474 }
            - { containerPort: 7687 }
          env:
            - name: NEO4J_AUTH
              valueFrom: { secretKeyRef: { name: novagen-secrets, key: NEO4J_AUTH } }
          volumeMounts:
            - name: neo4jdata
              mountPath: /data
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits: { cpu: "1", memory: "2Gi" }
  volumeClaimTemplates:
    - metadata: { name: neo4jdata }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: novagen
spec:
  selector: { app: neo4j }
  ports:
    - { name: http, port: 7474, targetPort: 7474 }
    - { name: bolt, port: 7687, targetPort: 7687 }
  clusterIP: None
