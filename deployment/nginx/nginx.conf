worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream gateway_upstream {
        server gateway:8000;
    }

    server {
        listen 80;
        server_name novagen.example.com api.novagen.example.com;
        return 301 https://$host$request_uri;
    }

    # Marketing site + dashboard
    server {
        listen 443 ssl http2;
        server_name novagen.example.com;

        ssl_certificate     /etc/nginx/certs/novagen.crt;
        ssl_certificate_key /etc/nginx/certs/novagen.key;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # API gateway — automation-service is never routed here; the gateway's own
    # route allow-list (backend/gateway/app/routes_map.py) enforces that boundary.
    server {
        listen 443 ssl http2;
        server_name api.novagen.example.com;

        ssl_certificate     /etc/nginx/certs/novagen.crt;
        ssl_certificate_key /etc/nginx/certs/novagen.key;

        client_max_body_size 25m;

        location / {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://gateway_upstream/health;
            access_log off;
        }
    }
}
